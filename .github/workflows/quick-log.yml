name: Quick log → progress log

# Turns a "[log]" issue (opened from the Quick update page or the GitHub app)
# into a progress-log entry, refreshes the README, redeploys, and closes the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: quick-log
  cancel-in-progress: false

jobs:
  append:
    # Only YOUR issues titled "[log] ..." are processed. Anyone else's issue is ignored.
    if: >-
      startsWith(github.event.issue.title, '[log]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Append log entry and tick completed tasks
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          LOG_TZ: America/New_York
        run: python scripts/append_log.py

      - name: Refresh README
        run: python scripts/update_readme.py

      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/progress-log.md content/roadmap content/projects content/skills.md README.md
          git commit -m "log: progress entry from #${ISSUE_NUMBER}"
          git push

      - name: Close the issue with a confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file .quick-log-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  # Anyone can open an issue on a public repo. "[log]" issues from anyone but
  # the owner are never written to the log; this closes and locks them.
  reject-others:
    if: >-
      startsWith(github.event.issue.title, '[log]') &&
      github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close and lock
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
            --comment "Only the repository owner can add progress-log entries. This issue was closed automatically and nothing was logged."
          gh issue lock "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason spam || true

  # Commits pushed with the built-in token don't trigger other workflows,
  # so the deploy workflow is called directly here.
  deploy:
    needs: append
    uses: ./.github/workflows/deploy.yml
