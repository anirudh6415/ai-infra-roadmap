name: Build & deploy site

# Runs on every push to main, on demand, and when the quick-log workflow calls it.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write   # to commit the refreshed README
  pages: write      # to deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync skill status from roadmap ticks
        run: python scripts/sync_skills.py

      - name: Refresh auto-generated README section
        run: python scripts/update_readme.py

      - name: Commit README and skills if they changed
        run: |
          if ! git diff --quiet README.md content/skills.md; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md content/skills.md
            git commit -m "chore: refresh README and skill status [skip ci]"
            git push
          else
            echo "README already up to date"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
